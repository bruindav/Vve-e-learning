<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beheer — E-learning VvE-bestuur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-navy:#132228; --ink-navy-deep:#0d1a1f; --paper:#ECE4D1; --paper-dark:#E2D8BF; --rule-soft:#2F4F4433;
    --ink-text:#2A2118; --ink-fade:#5A5040; --amber:#C98A2C; --amber-deep:#a86f1c; --debit:#a13d2c; --credit:#3d6b52;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--ink-navy); font-family:'IBM Plex Sans', sans-serif; color:var(--ink-text); min-height:100vh;}
  .brandbar{
    background:var(--ink-navy-deep); padding:14px 24px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid #ffffff14;
  }
  .brandbar span{font-family:'IBM Plex Sans',sans-serif; font-size:15px; font-weight:600; color:#f2efe6;}
  .brandbar a{color:#8fa8b3; font-size:12.5px; text-decoration:none;}

  .login-wrap{min-height:80vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .login-box{
    max-width:380px; width:100%; background:var(--paper); border-radius:4px; padding:32px 28px;
    box-shadow:0 20px 50px -20px #000000a0;
  }
  .login-box h1{font-family:'Fraunces',serif; font-size:22px; margin:0 0 18px; text-align:center;}
  button{
    padding:11px 18px; border:none; border-radius:3px; background:var(--amber); color:var(--ink-navy-deep);
    font-weight:600; font-size:14px; cursor:pointer; font-family:'IBM Plex Sans',sans-serif;
  }
  button:hover{background:#e0a94b;}
  button:disabled{opacity:.6; cursor:default;}
  .error{color:var(--debit); font-size:13px; margin-top:10px; display:none;}
  .error.show{display:block;}

  main{max-width:920px; margin:0 auto; padding:32px 20px 80px; display:none;}
  main.show{display:block;}
  h2{font-family:'Fraunces',serif; font-size:22px; color:#fff; margin:28px 0 6px;}
  h2:first-child{margin-top:0;}
  .section-sub{color:#a8b5ba; font-size:13.5px; margin:0 0 20px;}

  .vve-card{
    background:var(--paper); border-radius:4px; padding:20px 22px; margin-bottom:16px;
    box-shadow:0 1px 0 var(--rule-soft), 0 10px 24px -16px #00000080;
  }
  .vve-card.pending{border:2px solid var(--amber);}
  .vve-head{display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px 14px; margin-bottom:14px;}
  .vve-name{font-family:'Fraunces',serif; font-size:17px; font-weight:600;}
  .vve-email{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-fade); margin-right:auto;}
  .status-badge{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600; letter-spacing:.04em;
    text-transform:uppercase; padding:4px 9px; border-radius:2px;
  }
  .status-badge.pending{background:#C98A2C22; color:var(--amber-deep); border:1px solid #C98A2C55;}
  .status-badge.approved{background:#3d6b5222; color:var(--credit); border:1px solid #3d6b5255;}
  .delete-btn{
    background:none; border:1px solid var(--debit); color:var(--debit); font-size:11.5px; font-weight:600;
    padding:5px 10px; border-radius:3px; cursor:pointer; font-family:'IBM Plex Sans',sans-serif;
  }
  .delete-btn:hover{background:var(--debit); color:#fff;}
  .approve-btn{font-size:13px; padding:9px 16px;}

  .module-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:8px; margin-bottom:14px;}
  .module-toggle{
    display:flex; align-items:center; gap:8px; font-size:13px; padding:8px 10px; border:1px solid var(--rule-soft);
    border-radius:3px; background:#fff8; cursor:pointer;
  }
  .module-toggle input{width:auto; margin:0;}
  .module-toggle.saving{opacity:.5;}
  .empty{color:#a8b5ba; text-align:center; padding:24px 0; font-size:13.5px;}
</style>
</head>
<body>

<div class="brandbar">
  <span>digidave &middot; beheer</span>
  <a href="index.html">Naar de site &rarr;</a>
</div>

<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <h1>Beheer &mdash; inloggen</h1>
    <button type="button" id="googleLoginBtn" style="width:100%; display:flex; align-items:center; justify-content:center; gap:10px;">
      <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.16.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Inloggen met Google
    </button>
    <div class="error" id="loginError"></div>
  </div>
</div>

<main id="main">
  <h2>Wachtend op goedkeuring</h2>
  <p class="section-sub">Nieuwe registraties. Ken modules toe om ze goed te keuren — de VvE krijgt dan een bevestigingsmail.</p>
  <div id="pendingList"><div class="empty">Bezig met laden...</div></div>

  <h2>Goedgekeurde VvE's</h2>
  <p class="section-sub">Zet per VvE modules aan of uit.</p>
  <div id="approvedList"></div>
</main>

<script type="module">
  import { auth, watchAuth, adminSignInWithGoogle, getAllVves, approveVve, setModuleAccess, deleteVve, logout } from './assets/vve-auth.js?v25';
  import { ADMIN_EMAIL, ALL_MODULES } from './assets/firebase-config.js?v25';

  const loginWrap = document.getElementById('loginWrap');
  const main = document.getElementById('main');
  const googleLoginBtn = document.getElementById('googleLoginBtn');
  const loginError = document.getElementById('loginError');
  const pendingList = document.getElementById('pendingList');
  const approvedList = document.getElementById('approvedList');

  googleLoginBtn.addEventListener('click', async function(){
    loginError.classList.remove('show');
    googleLoginBtn.disabled = true;
    try {
      await adminSignInWithGoogle();
    } catch (err) {
      loginError.textContent = 'Inloggen mislukt: ' + (err && err.message ? err.message : err);
      loginError.classList.add('show');
    } finally {
      googleLoginBtn.disabled = false;
    }
  });

  function attachDelete(card, vve){
    card.querySelector('.delete-btn').addEventListener('click', async function(){
      var confirmed = window.confirm(
        'Weet je zeker dat je de registratie van ' + (vve.naam || vve.email) + ' (' + vve.email + ') wilt verwijderen?'
      );
      if (!confirmed) return;
      try {
        await deleteVve(vve.id);
        card.remove();
      } catch (err) {
        alert('Verwijderen mislukt: ' + (err && err.message ? err.message : err));
      }
    });
  }

  function renderPendingCard(vve){
    var card = document.createElement('div');
    card.className = 'vve-card pending';

    var head = document.createElement('div');
    head.className = 'vve-head';
    head.innerHTML =
      '<span class="vve-name">' + (vve.naam || '(naam onbekend)') + '</span>' +
      '<span class="vve-email">' + vve.email + '</span>' +
      '<span class="status-badge pending">Wachtend</span>' +
      '<button type="button" class="delete-btn">Verwijderen</button>';
    card.appendChild(head);

    var grid = document.createElement('div');
    grid.className = 'module-grid';
    ALL_MODULES.forEach(function(mod){
      var label = document.createElement('label');
      label.className = 'module-toggle';
      var checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.value = mod.slug;
      label.appendChild(checkbox);
      label.appendChild(document.createTextNode(mod.title));
      grid.appendChild(label);
    });
    card.appendChild(grid);

    var approveBtn = document.createElement('button');
    approveBtn.type = 'button';
    approveBtn.className = 'approve-btn';
    approveBtn.textContent = '\u2713 Goedkeuren met gekozen modules';
    approveBtn.addEventListener('click', async function(){
      var chosen = [...grid.querySelectorAll('input:checked')].map(function(cb){ return cb.value; });
      var moduleAccess = {};
      chosen.forEach(function(slug){ moduleAccess[slug] = true; });
      approveBtn.disabled = true;
      approveBtn.textContent = 'Bezig...';
      try {
        await approveVve(vve.id, vve.email, vve.naam, moduleAccess);
        renderAll();
      } catch (err) {
        alert('Goedkeuren mislukt: ' + (err && err.message ? err.message : err));
        approveBtn.disabled = false;
        approveBtn.textContent = '\u2713 Goedkeuren met gekozen modules';
      }
    });
    card.appendChild(approveBtn);

    attachDelete(card, vve);
    return card;
  }

  function renderApprovedCard(vve){
    var card = document.createElement('div');
    card.className = 'vve-card';

    var head = document.createElement('div');
    head.className = 'vve-head';
    head.innerHTML =
      '<span class="vve-name">' + (vve.naam || '(naam onbekend)') + '</span>' +
      '<span class="vve-email">' + vve.email + '</span>' +
      '<span class="status-badge approved">Goedgekeurd</span>' +
      '<button type="button" class="delete-btn">Verwijderen</button>';
    card.appendChild(head);

    var grid = document.createElement('div');
    grid.className = 'module-grid';
    ALL_MODULES.forEach(function(mod){
      var enabled = !!(vve.moduleAccess && vve.moduleAccess[mod.slug] === true);
      var label = document.createElement('label');
      label.className = 'module-toggle';
      var checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = enabled;
      checkbox.addEventListener('change', async function(){
        label.classList.add('saving');
        try {
          await setModuleAccess(vve.id, mod.slug, checkbox.checked);
        } catch (err) {
          alert('Opslaan mislukt: ' + (err && err.message ? err.message : err));
          checkbox.checked = !checkbox.checked;
        } finally {
          label.classList.remove('saving');
        }
      });
      label.appendChild(checkbox);
      label.appendChild(document.createTextNode(mod.title));
      grid.appendChild(label);
    });
    card.appendChild(grid);

    attachDelete(card, vve);
    return card;
  }

  async function renderAll(){
    var vves = await getAllVves();
    var pending = vves.filter(function(v){ return v.status === 'pending'; });
    var approved = vves.filter(function(v){ return v.status === 'approved'; });

    pendingList.innerHTML = '';
    if (pending.length === 0) {
      pendingList.innerHTML = '<div class="empty">Geen wachtende aanvragen.</div>';
    } else {
      pending.forEach(function(vve){ pendingList.appendChild(renderPendingCard(vve)); });
    }

    approvedList.innerHTML = '';
    if (approved.length === 0) {
      approvedList.innerHTML = '<div class="empty">Nog geen goedgekeurde VvE\u2019s.</div>';
    } else {
      approved.forEach(function(vve){ approvedList.appendChild(renderApprovedCard(vve)); });
    }
  }

  watchAuth(function(user){
    if (user && user.email === ADMIN_EMAIL) {
      loginWrap.style.display = 'none';
      main.classList.add('show');
      renderAll();
    } else if (user) {
      loginWrap.style.display = 'flex';
      main.classList.remove('show');
      loginError.textContent = 'Dit account heeft geen beheerrechten.';
      loginError.classList.add('show');
      logout();
    } else {
      loginWrap.style.display = 'flex';
      main.classList.remove('show');
    }
  });
</script>

</body>
</html>
