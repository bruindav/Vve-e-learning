<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inloggen — E-learning VvE-bestuur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-navy:#132228; --ink-navy-deep:#0d1a1f; --paper:#ECE4D1; --rule-soft:#2F4F4433;
    --ink-text:#2A2118; --ink-fade:#5A5040; --amber:#C98A2C; --amber-deep:#a86f1c; --debit:#a13d2c; --credit:#3d6b52;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:radial-gradient(ellipse at 30% -10%, #1c343c 0%, transparent 55%), var(--ink-navy);
    font-family:'IBM Plex Sans', sans-serif;
  }
  .box{
    max-width:420px; width:100%; background:var(--paper); border-radius:4px; padding:36px 32px;
    box-shadow:0 20px 50px -20px #000000a0;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--amber-deep); margin-bottom:14px; text-align:center;
  }
  h1{font-family:'Fraunces',serif; font-size:24px; color:var(--ink-text); margin:0 0 10px; text-align:center;}
  p.sub{font-size:13.5px; color:var(--ink-fade); line-height:1.5; margin:0 0 24px; text-align:center;}
  label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-text); margin-bottom:6px;}
  input{
    width:100%; box-sizing:border-box; padding:11px 12px; border:1px solid var(--rule-soft); border-radius:3px;
    font-size:14px; margin-bottom:16px; font-family:'IBM Plex Sans',sans-serif;
  }
  button{
    width:100%; padding:12px; border:none; border-radius:3px; background:var(--amber);
    color:var(--ink-navy-deep); font-weight:600; font-size:14.5px; cursor:pointer; font-family:'IBM Plex Sans',sans-serif;
  }
  button:hover{background:#e0a94b;}
  button:disabled{opacity:.6; cursor:default;}
  .msg{margin-top:16px; font-size:13px; padding:12px 14px; border-radius:3px; display:none;}
  .msg.show{display:block;}
  .msg.ok{background:#3d6b521a; border:1px solid #3d6b5233; color:#264936;}
  .msg.error{background:#a13d2c1a; border:1px solid #a13d2c33; color:#7a2c1f;}
  .back{display:block; text-align:center; margin-top:20px; font-size:12.5px; color:var(--ink-fade); text-decoration:none;}
  .back:hover{color:var(--ink-text);}
  .signed-in{text-align:center;}
  .signed-in a.btn{
    display:inline-block; margin-top:16px; padding:11px 20px; background:var(--amber); color:var(--ink-navy-deep);
    font-weight:600; border-radius:3px; text-decoration:none; font-size:14px;
  }
</style>
</head>
<body>

<div class="box" id="box">
  <div class="eyebrow">Digidave &middot; E-learning VvE-bestuur</div>
  <h1>Inloggen voor jullie VvE</h1>
  <p class="sub">Vul het e-mailadres van jullie VvE in. Je ontvangt een inloglink per e-mail &mdash; geen wachtwoord nodig.</p>

  <form id="registerForm">
    <label for="naam">Naam van de VvE (optioneel)</label>
    <input type="text" id="naam" placeholder="bijv. VVE Fazantenkamp" autocomplete="organization">
    <label for="email">E-mailadres</label>
    <input type="email" id="email" placeholder="bestuur@voorbeeld.nl" autocomplete="email" required>
    <button type="submit" id="submitBtn">Verstuur inloglink</button>
  </form>

  <div class="msg" id="msg"></div>

  <a class="back" href="index.html">&larr; Terug naar overzicht</a>
</div>

<script type="module">
  import { registerAndSendLink, completeSignInIfLink, watchAuth, logout } from './assets/vve-auth.js?v4';

  const box = document.getElementById('box');
  const form = document.getElementById('registerForm');
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');

  function showMsg(text, kind){
    msg.textContent = text;
    msg.className = 'msg show ' + kind;
  }

  function renderSignedIn(user){
    var params = new URLSearchParams(window.location.search);
    var moduleSlug = params.get('module');
    var moduleLink = moduleSlug ? 'modules/' + moduleSlug + '.html' : 'index.html';
    box.innerHTML =
      '<div class="eyebrow">Digidave &middot; E-learning VvE-bestuur</div>' +
      '<h1>Je bent ingelogd</h1>' +
      '<div class="signed-in">' +
      '<p class="sub">Ingelogd als ' + user.email + '</p>' +
      '<a class="btn" href="' + moduleLink + '">Ga verder</a>' +
      '<br><a class="back" href="#" id="logoutLink">Uitloggen</a>' +
      '</div>';
    document.getElementById('logoutLink').addEventListener('click', function(e){
      e.preventDefault();
      logout().then(function(){ window.location.reload(); });
    });
  }

  completeSignInIfLink().catch(function(err){
    var code = err && err.code;
    if (code === 'auth/invalid-action-code' || code === 'auth/expired-action-code') {
      showMsg(
        'Deze inloglink is al gebruikt of verlopen — dit gebeurt soms doordat een e-mail- of ' +
        'spamfilter de link automatisch "bezoekt" om te scannen, nog vóórdat je er zelf op klikt. ' +
        'Vraag hieronder een nieuwe link aan en klik die zo snel mogelijk aan.',
        'error'
      );
    } else if (code) {
      showMsg('Inloggen via de link is mislukt: ' + err.message, 'error');
    }
  });

  watchAuth(function(user){
    if (user) renderSignedIn(user);
  });

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    var email = document.getElementById('email').value;
    var naam = document.getElementById('naam').value;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Bezig...';
    try {
      var result = await registerAndSendLink(email, naam);
      if (result.isNew) {
        showMsg('Registratie gelukt! Inloglink verstuurd naar ' + email + '. Check je inbox (en spam-map) en klik op de link om in te loggen.', 'ok');
      } else {
        showMsg('Dit e-mailadres was al geregistreerd. We hebben een nieuwe inloglink gestuurd naar ' + email + ' — check je inbox (en spam-map).', 'ok');
      }
      form.reset();
    } catch (err) {
      showMsg('Er ging iets mis: ' + (err && err.message ? err.message : err), 'error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Verstuur inloglink';
    }
  });
</script>

</body>
</html>
